<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>JorSalasDEV</title>
    <style>
      body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
      #unity-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
      #unity-canvas { width: 100%; height: 100%; background: transparent !important; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/InteractiveHeader.loader.js";
      
      var config = {
        dataUrl: buildUrl + "/InteractiveHeader.data.unityweb",
        frameworkUrl: buildUrl + "/InteractiveHeader.framework.js.unityweb",
        codeUrl: buildUrl + "/InteractiveHeader.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "JorSalasDEV_AssetFactory",
        productVersion: "0.1.0",
        backgroundColor: "transparent" // FORZAMOS TRANSPARENCIA AQUÍ
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config).then((unityInstance) => {
          console.log("Unity cargado y transparente");
        }).catch((message) => {
          console.error(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
